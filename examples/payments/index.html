<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AriannA — Payments starter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 14px ui-sans-serif, system-ui, sans-serif;
    background: #0f1115; color: #e8e8ec;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  #app {
    width: 100%; max-width: 480px;
    background: #1a1d24;
    padding: 32px;
    border-radius: 16px;
    border: 1px solid #2a2d36;
    display: flex; flex-direction: column; gap: 16px;
  }
  h1 { font-size: 20px; color: #e40c88; }
  .summary {
    background: #0f1115;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid #2a2d36;
    display: flex; justify-content: space-between;
    font-family: ui-monospace, monospace; font-size: 13px;
  }
  .summary .total { color: #e40c88; font-weight: 600; }
  #gateway-mount { min-height: 200px; }
  .log {
    background: #0f1115;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #2a2d36;
    font: 11px ui-monospace, monospace;
    color: #8a8f98;
    max-height: 120px;
    overflow-y: auto;
  }
</style>
</head>
<body>

<div id="app">
  <h1>Checkout · €99.00</h1>
  <div class="summary">
    <span>Total to pay</span>
    <span class="total">€99.00 EUR</span>
  </div>
  <div id="gateway-mount"></div>
  <div class="log" id="log">Waiting for payment provider selection…</div>
</div>

<script type="module" src="./arianna.js"></script>
<script type="module" src="./arianna-additionals.js"></script>
<script type="module" src="./arianna-components.js"></script>
<script type="module" src="src/app.ts"></script>

</body>
</html>

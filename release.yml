name: Release ZIPs

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AriannA-Js-Starters
        uses: actions/checkout@v4

      - name: Checkout arianna-web (for the 3 runtime bundles)
        uses: actions/checkout@v4
        with:
          repository: Riccardo-Angeli/arianna-web
          path: arianna-web
          # If arianna-web is private, set ARIANNA_WEB_PAT in repo secrets.
          token: ${{ secrets.ARIANNA_WEB_PAT || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Build all 18 ZIPs
        run: node scripts/build-zips.js --runtime=./arianna-web

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          name: AriannA Starters ${{ github.ref_name }}
          draft: false
          prerelease: false
